<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIFTY Analysis Journal</title>
<script>
  (function () {
    try {
      const stored = localStorage.getItem('theme');
      const dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) {}
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          bg:     'rgb(var(--bg) / <alpha-value>)',
          panel:  'rgb(var(--panel) / <alpha-value>)',
          panel2: 'rgb(var(--panel2) / <alpha-value>)',
          border: 'rgb(var(--border) / <alpha-value>)',
          ink:    'rgb(var(--ink) / <alpha-value>)',
          ink2:   'rgb(var(--ink2) / <alpha-value>)',
          muted:  'rgb(var(--muted) / <alpha-value>)',
          subtle: 'rgb(var(--subtle) / <alpha-value>)',
          up:     'rgb(var(--up) / <alpha-value>)',
          down:   'rgb(var(--down) / <alpha-value>)',
          amber:  'rgb(var(--amber) / <alpha-value>)',
          accent: 'rgb(var(--accent) / <alpha-value>)',
        }
      }
    }
  }
</script>
<style>
  :root {
    --bg: 247 248 250;
    --panel: 255 255 255;
    --panel2: 241 243 246;
    --border: 226 229 234;
    --ink: 15 23 42;
    --ink2: 51 65 85;
    --muted: 100 116 139;
    --subtle: 148 163 184;
    --up: 13 148 136;
    --down: 220 38 38;
    --amber: 217 119 6;
    --accent: 79 70 229;
    --scroll: 203 210 219;
  }
  .dark {
    --bg: 8 10 15;
    --panel: 31 37 51;
    --panel2: 40 47 63;
    --border: 52 60 78;
    --ink: 248 250 252;
    --ink2: 222 228 238;
    --muted: 120 134 158;
    --subtle: 82 96 118;
    --up: 45 212 191;
    --down: 244 100 96;
    --amber: 251 191 36;
    --accent: 129 140 248;
    --scroll: 42 48 64;
  }
  html, body { height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background-image:
      radial-gradient(1100px 520px at 100% -12%, rgb(var(--accent) / 0.07), transparent 62%),
      radial-gradient(900px 480px at -8% 0%, rgb(var(--up) / 0.05), transparent 60%);
    background-attachment: fixed;
  }
  .tnum { font-variant-numeric: tabular-nums; }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgb(var(--scroll)); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  body, header, aside, main, .theme-fade { transition: background-color .2s ease, border-color .2s ease, color .2s ease; }
  .date-item[data-active="true"] {
    background: rgb(var(--ink) / 0.045);
    border-color: rgb(var(--ink) / 0.16);
    box-shadow: inset 2px 0 0 0 rgb(var(--accent));
  }
  #iconSun { display: none; }
  .dark #iconMoon { display: none; }
  .dark #iconSun { display: block; }
  .sect { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgb(var(--muted)); }
</style>
</head>
<body class="bg-bg text-ink2 h-full overflow-hidden">

  <div class="h-full flex flex-col">

    <!-- Top bar -->
    <header class="shrink-0 h-16 border-b border-border flex items-center justify-between px-4 sm:px-6 bg-panel/70 backdrop-blur z-10">
      <div class="flex items-center gap-3">
        <button id="mobileMenuBtn" class="md:hidden w-8 h-8 flex items-center justify-center rounded-lg border border-border text-muted hover:text-ink hover:border-subtle transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent/50">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-accent to-up hidden sm:flex items-center justify-center text-white text-sm font-bold shrink-0">N</div>
        <div>
          <h1 class="text-lg sm:text-xl font-semibold text-ink tracking-tight leading-none">NIFTY <span class="text-muted font-normal">Daily Analysis Journal</span></h1>
          <p class="text-xs text-muted mt-1" id="entryCount"></p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div id="headerQuote" class="hidden sm:flex items-center gap-2 mr-1 pr-3 border-r border-border text-right"></div>
        <button id="prevBtn" class="w-8 h-8 flex items-center justify-center rounded-lg border border-border text-muted hover:text-ink hover:border-subtle transition disabled:opacity-30 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent/50" title="Older">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button id="nextBtn" class="w-8 h-8 flex items-center justify-center rounded-lg border border-border text-muted hover:text-ink hover:border-subtle transition disabled:opacity-30 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent/50" title="Newer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button id="themeToggle" class="w-8 h-8 flex items-center justify-center rounded-lg border border-border text-muted hover:text-ink hover:border-subtle transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent/50" title="Toggle light / dark mode">
          <svg id="iconSun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg id="iconMoon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>

    <div class="flex-1 min-h-0 flex">

      <!-- Sidebar (desktop) -->
      <aside class="hidden md:flex md:flex-col w-72 shrink-0 border-r border-border bg-panel/40">
        <div class="px-4 py-3 sect border-b border-border shrink-0">Session log</div>
        <div id="dateListDesktop" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
      </aside>

      <!-- Mobile date drawer -->
      <div id="mobileDrawer" class="md:hidden fixed inset-0 z-20 hidden">
        <div id="mobileOverlay" class="absolute inset-0 bg-black/60"></div>
        <aside class="absolute left-0 top-0 bottom-0 w-72 max-w-[80vw] bg-bg border-r border-border flex flex-col">
          <div class="px-4 py-3 sect border-b border-border flex items-center justify-between shrink-0">
            <span>Session log</span>
            <button id="mobileCloseBtn" class="text-muted hover:text-ink text-lg leading-none">&times;</button>
          </div>
          <div id="dateListMobile" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
        </aside>
      </div>

      <!-- Main content -->
      <main class="flex-1 min-w-0 overflow-y-auto">
        <div id="entryContainer" class="w-full max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-6"></div>
      </main>

    </div>
  </div>

<script>
let ENTRIES = [];
let SPARK = null;

const fmt = n => n.toLocaleString('en-IN', { maximumFractionDigits: 2 });
const fmt0 = n => n.toLocaleString('en-IN', { maximumFractionDigits: 0 });
const clampPct = (v, lo, hi) => hi === lo ? 50 : Math.max(0, Math.min(100, ((v - lo) / (hi - lo)) * 100));

const dateListDesktop = document.getElementById('dateListDesktop');
const dateListMobile = document.getElementById('dateListMobile');
const entryContainer = document.getElementById('entryContainer');
const entryCount = document.getElementById('entryCount');
const headerQuote = document.getElementById('headerQuote');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const mobileMenuBtn = document.getElementById('mobileMenuBtn');
const mobileDrawer = document.getElementById('mobileDrawer');
const mobileOverlay = document.getElementById('mobileOverlay');
const mobileCloseBtn = document.getElementById('mobileCloseBtn');
const themeToggle = document.getElementById('themeToggle');

themeToggle.addEventListener('click', () => {
  const isDark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
});

let activeIndex = 0;

const arrow = up => `<svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor" class="shrink-0"><path d="${up ? 'M12 4l9 16H3z' : 'M12 20L3 4h18z'}"/></svg>`;

function dateListItemHtml(e, i) {
  const up = e.change >= 0;
  const chgColor = up ? 'text-up' : 'text-down';
  const chgSign = up ? '+' : '';
  const d = new Date(e.date + 'T00:00:00');
  const label = d.toLocaleDateString('en-IN', { weekday: 'short', month: 'short', day: 'numeric' });
  return `<button type="button" data-index="${i}" data-active="${i === activeIndex}" class="date-item w-full text-left px-3 py-2.5 rounded-xl border border-transparent hover:bg-ink/[0.03] hover:border-border transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent/50">
    <div class="flex items-center justify-between gap-2">
      <span class="text-sm font-medium text-ink2">${label}</span>
      <span class="inline-flex items-center gap-1 text-xs font-medium ${chgColor}">${arrow(up)}${chgSign}${e.changePct}%</span>
    </div>
    <div class="text-xs ${up ? 'text-up' : 'text-down'} mt-0.5 tnum">${fmt(e.close)}</div>
  </button>`;
}

function renderDateLists() {
  const html = ENTRIES.map((e, i) => dateListItemHtml(e, i)).join('');
  dateListDesktop.innerHTML = html;
  dateListMobile.innerHTML = html;
}

function setActive(i) {
  if (i < 0 || i >= ENTRIES.length) return;
  activeIndex = i;
  renderDateLists();
  renderEntry(activeIndex);
  updateNavButtons();
  closeMobileDrawer();
  const activeEl = dateListDesktop.querySelector(`[data-index="${i}"]`);
  if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
}

[dateListDesktop, dateListMobile].forEach(list => {
  list.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.date-item');
    if (!btn) return;
    setActive(Number(btn.dataset.index));
  });
});

/* ---------- Close sparkline (last N sessions) ---------- */
function buildSpark() {
  const chrono = ENTRIES.slice().reverse();          // oldest -> newest
  const n = chrono.length;
  const W = 640, H = 150, padL = 6, padR = 6, padT = 16, padB = 10;
  const closes = chrono.map(e => e.close);
  let mn = Math.min(...closes), mx = Math.max(...closes);
  if (mn === mx) { mn -= 1; mx += 1; }
  const gap = (mx - mn) * 0.14; mn -= gap; mx += gap;
  const X = i => padL + (n <= 1 ? 0 : (i / (n - 1)) * (W - padL - padR));
  const Y = v => padT + (1 - (v - mn) / (mx - mn)) * (H - padT - padB);
  const pts = chrono.map((e, i) => ({ x: X(i), y: Y(e.close), c: e.close, d: e.date }));
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(2) + ' ' + p.y.toFixed(2)).join(' ');
  const area = `${line} L ${X(n - 1).toFixed(2)} ${H - padB} L ${X(0).toFixed(2)} ${H - padB} Z`;
  const upWin = closes[n - 1] >= closes[0];
  SPARK = { pts, n, W, H };
  return { line, area, upWin, W, H, activeChrono: (n - 1 - activeIndex),
           lo: Math.min(...closes), hi: Math.max(...closes) };
}

function sparkCardHtml() {
  const s = buildSpark();
  const hue = s.upWin ? 'up' : 'down';
  const ap = SPARK.pts[s.activeChrono] || SPARK.pts[SPARK.pts.length - 1];
  return `
    <div class="bg-panel border border-border rounded-2xl p-5 shadow-sm shadow-black/5 flex flex-col">
      <div class="flex items-baseline justify-between mb-1">
        <div class="sect">Close &middot; last ${ENTRIES.length} sessions</div>
        <div class="text-[11px] text-subtle tnum">${fmt(s.lo)} &ndash; ${fmt(s.hi)}</div>
      </div>
      <div id="sparkWrap" class="relative flex-1 min-h-[150px]">
        <svg id="sparkSvg" viewBox="0 0 ${s.W} ${s.H}" class="w-full block" style="aspect-ratio:${s.W}/${s.H}">
          <defs>
            <linearGradient id="sparkFill" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="rgb(var(--${hue}))" stop-opacity="0.22"/>
              <stop offset="1" stop-color="rgb(var(--${hue}))" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="${s.area}" fill="url(#sparkFill)"/>
          <path d="${s.line}" fill="none" stroke="rgb(var(--${hue}))" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
          <line id="sparkCross" x1="0" x2="0" y1="0" y2="${s.H}" stroke="rgb(var(--subtle))"
                stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke" class="hidden"/>
          <circle id="sparkHoverDot" r="3.5" fill="rgb(var(--ink))" class="hidden"/>
          <circle id="sparkActive" r="4" cx="${ap.x.toFixed(2)}" cy="${ap.y.toFixed(2)}"
                  fill="rgb(var(--${hue}))" stroke="rgb(var(--panel))" stroke-width="2"/>
          <rect id="sparkHit" x="0" y="0" width="${s.W}" height="${s.H}" fill="transparent"/>
        </svg>
        <div id="sparkTip" class="pointer-events-none absolute z-10 hidden px-2 py-1 rounded-lg bg-ink text-bg text-[11px] font-medium whitespace-nowrap -translate-x-1/2 -translate-y-full shadow-lg"></div>
      </div>
    </div>`;
}

function wireSparkline() {
  const svg = document.getElementById('sparkSvg');
  if (!svg || !SPARK) return;
  const hit = document.getElementById('sparkHit');
  const cross = document.getElementById('sparkCross');
  const dot = document.getElementById('sparkHoverDot');
  const tip = document.getElementById('sparkTip');

  const nearest = ux => {
    let best = 0, bd = Infinity;
    SPARK.pts.forEach((p, i) => { const d = Math.abs(p.x - ux); if (d < bd) { bd = d; best = i; } });
    return best;
  };
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const ux = (ev.clientX - r.left) / r.width * SPARK.W;
    const p = SPARK.pts[nearest(ux)];
    cross.setAttribute('x1', p.x); cross.setAttribute('x2', p.x); cross.classList.remove('hidden');
    dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.y); dot.classList.remove('hidden');
    tip.classList.remove('hidden');
    tip.style.left = (p.x / SPARK.W * r.width) + 'px';
    tip.style.top = (p.y / SPARK.H * r.height - 6) + 'px';
    const dt = new Date(p.d + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    tip.innerHTML = `<span class="opacity-60">${dt}</span>&nbsp;&nbsp;${fmt(p.c)}`;
  };
  const leave = () => { cross.classList.add('hidden'); dot.classList.add('hidden'); tip.classList.add('hidden'); };
  hit.addEventListener('mousemove', move);
  hit.addEventListener('mouseleave', leave);
}

/* ---------- Entry ---------- */
function renderEntry(idx) {
  const e = ENTRIES[idx];
  if (!e) { entryContainer.innerHTML = '<p class="text-muted text-sm">No entry.</p>'; return; }

  const up = e.change >= 0;
  const chgColor = up ? 'text-up' : 'text-down';
  const chgSign = up ? '+' : '';
  const longDate = new Date(e.date + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  headerQuote.innerHTML = `
    <div class="leading-none">
      <div class="text-sm font-semibold ${chgColor} tnum">${fmt(e.close)}</div>
      <div class="text-[11px] font-medium ${chgColor} tnum mt-0.5">${chgSign}${fmt(e.change)} (${chgSign}${e.changePct}%)</div>
    </div>`;

  /* -- distance-from-close annotation for a level -- */
  const distNote = price => {
    const d = e.close - price;
    const above = d < 0;
    const cls = above ? 'text-down' : 'text-up';
    return `<span class="inline-flex items-center gap-1 ${cls}">${arrow(above)}${fmt0(Math.abs(d))} pts ${above ? 'above' : 'below'} close &middot; ${Math.abs((d / price) * 100).toFixed(2)}%</span>`;
  };

  /* was this level actually respected or broken (in play), vs merely untested / positional? */
  const isActiveLevel = s => {
    s = (s || '').toLowerCase().trim();
    if (!s) return false;
    if (/^(untested|not reached|not yet tested|not tested|distant|far overhead|well overhead|first (bounce )?hurdle|first hurdle)/.test(s)) return false;
    if (/^price\s*[~\d]/.test(s) || /^price (well |~)?below/.test(s)) return false;
    const t = s.replace(/untested/g, '').replace(/not (yet )?tested/g, '');
    return /\b(held|brok\w*|breach\w*|test\w*|reclaim\w*|touch\w*|capp\w*|reject\w*|fail\w*|fad\w*|closed|close still|session low|(move|swing|pullback) low|sold off|gap[- ]?up|gapped)\b/.test(t);
  };

  const levelRow = (l, actionKey) => {
    const badgeColor = l.type === 'support' ? 'bg-up/10 text-up border-up/30' : 'bg-down/10 text-down border-down/30';
    const active = !actionKey && isActiveLevel(l.status);
    const actionCell = actionKey
      ? `<td class="px-4 py-3 text-right align-top text-xs text-amber">${l[actionKey]}</td>`
      : `<td class="px-4 py-3 text-right align-top text-xs ${active ? 'text-ink2 font-medium' : 'text-muted'}">${l.status}</td>`;
    return `<tr class="border-b border-border last:border-0 ${active ? 'bg-accent/[0.07]' : ''}">
      <td class="px-4 py-3 align-top ${active ? 'shadow-[inset_3px_0_0_0_rgb(var(--accent))]' : ''}">
        <div class="font-medium text-ink2">${l.name}</div>
        <div class="text-xs text-muted mt-0.5">${l.note}</div>
        <div class="text-[11px] mt-1">${distNote(l.price)}</div>
      </td>
      <td class="px-4 py-3 text-right align-top font-medium text-ink2 whitespace-nowrap tnum">${fmt(l.price)}</td>
      <td class="px-4 py-3 text-right align-top whitespace-nowrap">
        <span class="inline-block text-xs px-2 py-1 rounded-md border ${badgeColor}">${l.type}</span>
      </td>
      ${actionCell}
    </tr>`;
  };

  // every level table is ordered high -> low by NIFTY spot price (price ladder)
  const byPriceDesc = (a, b) => (b.price ?? -Infinity) - (a.price ?? -Infinity);
  const levelsHtml = e.levels.slice().sort(byPriceDesc).map(l => levelRow(l, null)).join('');
  const tomorrowLevelsHtml = (e.tomorrowLevels || []).slice().sort(byPriceDesc).map(l => levelRow(l, 'action')).join('');

  const watchHtml = e.watchTomorrow.map(w =>
    `<li class="flex gap-2.5 text-sm text-ink2 leading-relaxed">
      <span class="text-accent mt-1 shrink-0">&bull;</span>
      <span>${w}</span>
    </li>`
  ).join('');

  const newsHtml = (e.newsEvents || []).map(n =>
    `<li class="flex flex-col sm:flex-row sm:items-baseline gap-1 sm:gap-3 text-sm leading-relaxed py-2.5 border-b border-border last:border-0">
      <span class="shrink-0 inline-block text-xs px-2 py-0.5 rounded-md border border-accent/30 bg-accent/10 text-accent sm:w-32 sm:text-center">${n.category || 'News'}</span>
      <span class="text-ink2">${n.text}${n.source ? ` <span class="text-subtle">&mdash; ${n.source}</span>` : ''}</span>
    </li>`
  ).join('');

  const tp = e.tradePlan;
  const tpMeta = tp ? [
    tp.lots ? tp.lots + ' lot' + (tp.lots > 1 ? 's' : '') : null,
    tp.qty ? tp.qty + ' qty' : null,
    tp.instrument || null
  ].filter(Boolean).join(' · ') : '';
  const tradePlanRows = tp ? (tp.setups || []).map(s => {
    const b = (s.bias || '').toLowerCase();
    const badge = b === 'long' ? 'bg-up/10 text-up border-up/30'
      : b === 'short' ? 'bg-down/10 text-down border-down/30'
      : 'bg-ink/5 text-muted border-border';
    return `<tr class="border-b border-border last:border-0 align-top">
      <td class="px-3 py-3">
        <div class="font-medium text-ink2">${s.name || ''}</div>
        ${s.priority ? `<div class="text-xs text-subtle mt-0.5">${s.priority}</div>` : ''}
        ${b ? `<span class="inline-block mt-1 text-xs px-2 py-0.5 rounded-md border ${badge}">${b}</span>` : ''}
        ${(s.entryTime || s.exitTime) ? `<div class="text-xs text-muted mt-1.5 leading-relaxed">${s.entryTime ? `<span class="text-subtle">Entry</span> ${s.entryTime}` : ''}${s.entryTime && s.exitTime ? '<br>' : ''}${s.exitTime ? `<span class="text-subtle">Exit</span> ${s.exitTime}` : ''}</div>` : ''}
      </td>
      <td class="px-3 py-3 text-ink2 break-words">${s.trigger || ''}</td>
      <td class="px-3 py-3 text-ink2 break-words">${s.entry || ''}</td>
      <td class="px-3 py-3 text-ink2 break-words">${s.stop || ''}${s.stopPoints ? ` <span class="text-subtle">(${s.stopPoints} pt)</span>` : ''}</td>
      <td class="px-3 py-3 text-amber break-words">${s.risk || ''}</td>
      <td class="px-3 py-3 text-ink2 break-words">${s.targets || ''}</td>
    </tr>`;
  }).join('') : '';
  const tradePlanHtml = tp ? `
    <div class="bg-panel border border-border rounded-2xl p-5 shadow-sm shadow-black/5 mb-6">
      <div class="flex flex-wrap items-baseline justify-between gap-2 mb-2">
        <div class="sect">Intraday trade plan${tp.for ? ` <span class="normal-case font-normal tracking-normal text-subtle">&mdash; for ${new Date(tp.for + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })}</span>` : ''}</div>
        ${tpMeta ? `<div class="text-xs text-subtle">${tpMeta}</div>` : ''}
      </div>
      ${tp.context ? `<p class="text-sm text-ink2 leading-relaxed mb-3">${tp.context}</p>` : ''}
      ${tp.pivots ? `<div class="border rounded-xl px-4 py-3 mb-3 text-sm leading-relaxed" style="background-color:rgb(var(--amber)/.10);border-color:rgb(var(--amber)/.35)">
        <div class="sect mb-1" style="color:rgb(var(--amber))">Daily pivots &amp; CPR${tp.pivots.basis ? ` <span class="normal-case font-normal tracking-normal text-subtle">&mdash; ${tp.pivots.basis}</span>` : ''}</div>
        ${(tp.pivots.pdh != null || tp.pivots.pdl != null) ? `<div><span class="text-subtle">PDH</span> ${tp.pivots.pdh != null ? fmt(tp.pivots.pdh) : '-'} &nbsp; <span class="text-subtle">PDL</span> ${tp.pivots.pdl != null ? fmt(tp.pivots.pdl) : '-'}</div>` : ''}
        ${tp.pivots.cpr ? `<div><span class="text-subtle">CPR</span> ${tp.pivots.cpr}</div>` : ''}
        ${tp.pivots.r ? `<div><span class="text-subtle">Resistance</span> ${tp.pivots.r}</div>` : ''}
        ${tp.pivots.s ? `<div><span class="text-subtle">Support</span> ${tp.pivots.s}</div>` : ''}
      </div>` : ''}
      <div class="border border-border rounded-xl overflow-hidden overflow-x-auto">
        <table class="w-full text-sm table-fixed min-w-[900px]">
          <colgroup>
            <col class="w-1/6"><col class="w-1/6"><col class="w-1/6"><col class="w-1/6"><col class="w-1/6"><col class="w-1/6">
          </colgroup>
          <thead class="bg-ink/[0.03] text-muted text-xs uppercase tracking-wide">
            <tr>
              <th class="text-left font-medium px-3 py-2.5">Setup</th>
              <th class="text-left font-medium px-3 py-2.5">Trigger</th>
              <th class="text-left font-medium px-3 py-2.5">Entry</th>
              <th class="text-left font-medium px-3 py-2.5">Stop</th>
              <th class="text-left font-medium px-3 py-2.5">Risk</th>
              <th class="text-left font-medium px-3 py-2.5">Targets</th>
            </tr>
          </thead>
          <tbody>${tradePlanRows}</tbody>
        </table>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-3">
        ${(tp.timing && tp.timing.length) ? `<div>
          <div class="sect mb-1.5">Timing</div>
          <ul class="space-y-1.5">${tp.timing.map(t => `<li class="flex gap-2 text-sm text-ink2 leading-relaxed"><span class="text-accent mt-1 shrink-0">&bull;</span><span>${t}</span></li>`).join('')}</ul>
        </div>` : ''}
        ${tp.sizingNote ? `<div>
          <div class="sect mb-1.5">Sizing</div>
          <p class="text-sm text-muted leading-relaxed">${tp.sizingNote}</p>
        </div>` : ''}
      </div>
      <p class="text-xs text-subtle mt-2">${tp.disclaimer || 'Level-based scenarios, not investment advice &mdash; wait for the trigger and confirm with live price action.'}</p>
    </div>` : '';

  /* -- KPI tiles -- */
  /* mild trend-tinted card background, layered over the panel colour in both themes */
  const toneStyle = t =>
    t === 'up'   ? 'background-image:linear-gradient(0deg,rgb(var(--up)/.09),rgb(var(--up)/.09));border-color:rgb(var(--up)/.30)'
  : t === 'down' ? 'background-image:linear-gradient(0deg,rgb(var(--down)/.09),rgb(var(--down)/.09));border-color:rgb(var(--down)/.30)'
  : '';
  const tile = (label, value, sub, valueCls, tone) => `<div class="bg-panel border border-border rounded-2xl px-4 py-3.5 shadow-sm shadow-black/5" style="${toneStyle(tone)}">
    <div class="text-[11px] text-muted uppercase tracking-wider mb-1.5">${label}</div>
    <div class="text-[15px] font-semibold ${valueCls || 'text-ink'} tnum leading-none">${value}</div>
    ${sub ? `<div class="mt-1.5 text-[11px] text-subtle">${sub}</div>` : ''}
  </div>`;

  /* value coloured relative to the prior close — shows the gap / range direction */
  const trendCls = v => v > e.prevClose ? 'text-up' : v < e.prevClose ? 'text-down' : 'text-ink';
  const trendTone = v => v > e.prevClose ? 'up' : v < e.prevClose ? 'down' : '';
  const vsPrev = v => {
    const d = v - e.prevClose, u = d >= 0;
    return `<span class="${u ? 'text-up' : 'text-down'}">${u ? '▲ +' : '▼ −'}${fmt0(Math.abs(d))} vs prev</span>`;
  };

  const rsi = e.rsi14;
  const rsiCol = rsi >= 70 ? 'var(--down)' : rsi <= 30 ? 'var(--up)' : 'var(--ink)';
  const rsiValCls = rsi >= 70 ? 'text-down' : rsi <= 30 ? 'text-up' : rsi >= 55 ? 'text-up' : rsi <= 45 ? 'text-down' : 'text-ink';
  const rsiZone = rsi >= 70 ? 'Overbought' : rsi <= 30 ? 'Oversold' : rsi >= 55 ? 'Bullish' : rsi <= 45 ? 'Bearish' : 'Neutral';
  const rsiTone = rsiValCls === 'text-up' ? 'up' : rsiValCls === 'text-down' ? 'down' : '';
  const rsiTile = `<div class="bg-panel border border-border rounded-2xl px-4 py-3.5 shadow-sm shadow-black/5" style="${toneStyle(rsiTone)}">
    <div class="text-[11px] text-muted uppercase tracking-wider mb-1.5">RSI &middot; 14D</div>
    <div class="text-[15px] font-semibold ${rsiValCls} tnum leading-none">${rsi}</div>
    <div class="mt-2.5 relative h-1.5 rounded-full" style="background:linear-gradient(90deg, rgb(var(--up)/.30) 0 30%, rgb(var(--subtle)/.25) 30% 70%, rgb(var(--down)/.30) 70% 100%)">
      <span class="absolute top-1/2 w-2 h-2 rounded-full" style="left:${Math.max(0, Math.min(100, rsi))}%;transform:translate(-50%,-50%);background:rgb(${rsiCol});box-shadow:0 0 0 2px rgb(var(--panel))"></span>
    </div>
    <div class="mt-1.5 text-[11px] ${rsiValCls}">${rsiZone}</div>
  </div>`;

  const dmaDist = ((e.close - e.sma200) / e.sma200) * 100;
  const dmaUp = dmaDist >= 0;
  const dmaSub = `<span class="${dmaUp ? 'text-up' : 'text-down'}">${dmaUp ? '▲' : '▼'} ${dmaUp ? '+' : ''}${dmaDist.toFixed(2)}% &middot; ${dmaUp ? 'above' : 'below'} close</span>`;

  const cprValue = e.cpr && e.cpr.width != null
    ? `~${e.cpr.width} pts`
    : '<span class="text-subtle">&mdash;</span>';
  const cprSub = e.cpr && e.cpr.width != null
    ? [e.cpr.label, e.cpr.range].filter(Boolean).join(' &middot; ')
    : '';

  const openPos = clampPct(e.open, e.dayLow, e.dayHigh);
  const closePos = clampPct(e.close, e.dayLow, e.dayHigh);

  const ml = e.markedLevels;
  const mlRow = (x, tone) => `<li class="flex items-baseline gap-2 py-1">
    <span class="tnum font-semibold ${tone === 'r' ? 'text-down' : 'text-up'}">${fmt(x.price)}</span>
    <span class="text-[12px] text-muted leading-snug">${x.label || ''}</span>
  </li>`;
  const markedLevelsHtml = ml && (((ml.resistance || []).length) || ((ml.support || []).length)) ? `
    <div class="bg-panel border border-border rounded-2xl p-5 shadow-sm shadow-black/5 mb-6">
      <div class="sect mb-2">S/R marked on chart${ml.spot != null ? ` <span class="normal-case font-normal tracking-normal text-subtle">&mdash; from spot ${fmt(ml.spot)}${ml.markedOn ? ', ' + ml.markedOn : ''}</span>` : ''}</div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-1">
        <div>
          <div class="text-[11px] font-semibold uppercase tracking-wider text-down mb-1">Resistance</div>
          <ul>${(ml.resistance || []).slice().sort((a, b) => a.price - b.price).map(x => mlRow(x, 'r')).join('')}</ul>
        </div>
        <div>
          <div class="text-[11px] font-semibold uppercase tracking-wider text-up mb-1">Support</div>
          <ul>${(ml.support || []).slice().sort((a, b) => b.price - a.price).map(x => mlRow(x, 's')).join('')}</ul>
        </div>
      </div>
      ${ml.note ? `<p class="text-[12px] text-subtle mt-3">${ml.note}</p>` : ''}
    </div>` : '';

  entryContainer.innerHTML = `
    <!-- Hero row -->
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-4 mb-4">
      <div class="bg-panel border border-border rounded-2xl p-5 shadow-sm shadow-black/5">
        <div class="flex items-center gap-2 text-xs text-muted mb-3">
          <span class="font-medium text-ink2">${e.symbol}</span>
          <span class="text-subtle">&middot;</span>
          <span>${longDate}</span>
        </div>
        <div class="flex flex-wrap items-end gap-x-4 gap-y-2">
          <div class="text-4xl font-semibold ${chgColor} tnum leading-none">${fmt(e.close)}</div>
          <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-sm font-medium ${up ? 'bg-up/10 text-up' : 'bg-down/10 text-down'}">
            ${arrow(up)} ${chgSign}${fmt(e.change)} &middot; ${chgSign}${e.changePct}%
          </div>
        </div>

        <div class="mt-6">
          <div class="flex justify-between text-[11px] text-muted mb-2">
            <span>Low <span class="${trendCls(e.dayLow)} tnum">${fmt(e.dayLow)}</span> <span class="text-subtle">${e.dayLowTime || ''}</span></span>
            <span>High <span class="${trendCls(e.dayHigh)} tnum">${fmt(e.dayHigh)}</span></span>
          </div>
          <div class="relative h-2 rounded-full bg-ink/[0.07]">
            <span class="absolute top-1/2 w-2.5 h-2.5 rounded-full border-2 border-muted bg-panel" style="left:${openPos}%;transform:translate(-50%,-50%)" title="Open ${fmt(e.open)}"></span>
            <span class="absolute top-1/2 w-3 h-3 rounded-full ${up ? 'bg-up' : 'bg-down'}" style="left:${closePos}%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px rgb(var(--panel))" title="Close ${fmt(e.close)}"></span>
          </div>
          <div class="flex gap-4 mt-2.5 text-[11px] text-subtle">
            <span class="inline-flex items-center gap-1.5"><span class="inline-block w-2 h-2 rounded-full border-2 border-muted"></span> Open <span class="${trendCls(e.open)} tnum">${fmt(e.open)}</span></span>
            <span class="inline-flex items-center gap-1.5"><span class="inline-block w-2 h-2 rounded-full ${up ? 'bg-up' : 'bg-down'}"></span> Close <span class="${chgColor} tnum">${fmt(e.close)}</span></span>
            <span class="inline-flex items-center gap-1.5">Prev <span class="text-ink2 tnum">${fmt(e.prevClose)}</span></span>
          </div>
        </div>
      </div>

      ${sparkCardHtml()}
    </div>

    <!-- KPI tiles -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-7 gap-3 mb-6">
      ${tile('Open', fmt(e.open), vsPrev(e.open), trendCls(e.open), trendTone(e.open))}
      ${tile('Day High', fmt(e.dayHigh), vsPrev(e.dayHigh), trendCls(e.dayHigh), trendTone(e.dayHigh))}
      ${tile('Day Low', fmt(e.dayLow), (e.dayLowTime ? e.dayLowTime + ' &middot; ' : '') + vsPrev(e.dayLow), trendCls(e.dayLow), trendTone(e.dayLow))}
      ${tile('Prev Close', fmt(e.prevClose))}
      ${rsiTile}
      ${tile('200-DMA', fmt(e.sma200), dmaSub, dmaUp ? 'text-up' : 'text-down', dmaUp ? 'up' : 'down')}
      ${tile('CPR width', cprValue, cprSub)}
    </div>

    <!-- Narrative + levels -->
    <div class="grid grid-cols-1 gap-4 mb-6 items-start">
      <div class="bg-panel border border-border rounded-2xl p-5 shadow-sm shadow-black/5">
        <div class="sect mb-2">What happened</div>
        <p class="text-sm text-ink2 leading-relaxed">${e.summary}</p>
      </div>

      <div class="bg-panel border border-border rounded-2xl p-5 shadow-sm shadow-black/5">
        <div class="sect mb-2">Levels respected / broken</div>
        <div class="border border-border rounded-xl overflow-hidden overflow-x-auto">
          <table class="w-full text-sm table-fixed">
            <colgroup>
              <col class="w-[46%]"><col class="w-[15%]"><col class="w-[15%]"><col class="w-[24%]">
            </colgroup>
            <tbody>${levelsHtml}</tbody>
          </table>
        </div>
      </div>
    </div>

    ${markedLevelsHtml}

    ${newsHtml ? `
    <div class="bg-panel border border-border rounded-2xl p-5 shadow-sm shadow-black/5 mb-6">
      <div class="sect mb-1">Market events &amp; news ahead</div>
      <ul>${newsHtml}</ul>
    </div>` : ''}

    <!-- Tomorrow -->
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-4 mb-6 items-start">
      <div class="bg-panel border border-border rounded-2xl p-5 shadow-sm shadow-black/5">
        <div class="sect mb-2">Tomorrow's key levels &mdash; entry / exit reference</div>
        <div class="border border-border rounded-xl overflow-hidden overflow-x-auto">
          <table class="w-full text-sm table-fixed">
            <colgroup>
              <col class="w-[40%]"><col class="w-[15%]"><col class="w-[15%]"><col class="w-[30%]">
            </colgroup>
            <thead class="bg-ink/[0.03] text-muted text-xs uppercase tracking-wide">
              <tr>
                <th class="text-left font-medium px-4 py-2.5">Level</th>
                <th class="text-right font-medium px-4 py-2.5">Price</th>
                <th class="text-right font-medium px-4 py-2.5">Type</th>
                <th class="text-right font-medium px-4 py-2.5">Action</th>
              </tr>
            </thead>
            <tbody>${tomorrowLevelsHtml}</tbody>
          </table>
        </div>
        <p class="text-xs text-subtle mt-2">Reference only, not investment advice &mdash; confirm with live price action before entering/exiting.</p>
      </div>

      <div class="space-y-4">
        <div class="bg-panel border border-border rounded-2xl p-5 shadow-sm shadow-black/5">
          <div class="sect mb-2">Watch tomorrow</div>
          <ul class="space-y-2">${watchHtml}</ul>
        </div>

        ${e.notes ? `
        <div class="bg-panel border border-border rounded-2xl p-5 shadow-sm shadow-black/5">
          <div class="sect mb-2">Notes</div>
          <p class="text-sm text-muted leading-relaxed">${e.notes}</p>
        </div>` : ''}
      </div>
    </div>

    ${tradePlanHtml}
  `;

  wireSparkline();
}

prevBtn.addEventListener('click', () => setActive(activeIndex + 1));
nextBtn.addEventListener('click', () => setActive(activeIndex - 1));

function updateNavButtons() {
  prevBtn.disabled = activeIndex >= ENTRIES.length - 1;
  nextBtn.disabled = activeIndex <= 0;
}

function openMobileDrawer() { mobileDrawer.classList.remove('hidden'); }
function closeMobileDrawer() { mobileDrawer.classList.add('hidden'); }
mobileMenuBtn.addEventListener('click', openMobileDrawer);
mobileCloseBtn.addEventListener('click', closeMobileDrawer);
mobileOverlay.addEventListener('click', closeMobileDrawer);

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowLeft') setActive(activeIndex + 1);
  if (ev.key === 'ArrowRight') setActive(activeIndex - 1);
});

function showLoading() {
  entryContainer.innerHTML = `<div class="flex items-center gap-2 text-sm text-muted py-10">
    <svg class="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9" stroke-opacity="0.25"/><path d="M21 12a9 9 0 0 0-9-9"/></svg>
    Loading journal data&hellip;
  </div>`;
  dateListDesktop.innerHTML = '<div class="px-3 py-2 text-xs text-subtle">Loading&hellip;</div>';
  dateListMobile.innerHTML = '<div class="px-3 py-2 text-xs text-subtle">Loading&hellip;</div>';
}

function showError(err) {
  const msg = `
    <div class="max-w-lg py-10">
      <div class="text-sm font-medium text-down mb-2">Couldn't load nifty_analysis.json</div>
      <p class="text-sm text-muted leading-relaxed mb-3">${err && err.message ? err.message : err}</p>
      <p class="text-xs text-muted leading-relaxed">If you opened this file directly (file://), the browser may be blocking local file requests. Serve the folder locally instead, e.g.:</p>
      <pre class="text-xs text-ink2 bg-panel border border-border rounded-xl p-3 mt-2 overflow-x-auto">python3 -m http.server 8000</pre>
      <p class="text-xs text-muted mt-2">then open <span class="text-ink2">http://localhost:8000/nifty_analysis.html</span></p>
    </div>`;
  entryContainer.innerHTML = msg;
  dateListDesktop.innerHTML = '<div class="px-3 py-2 text-xs text-down">Load failed</div>';
  dateListMobile.innerHTML = '<div class="px-3 py-2 text-xs text-down">Load failed</div>';
}

async function loadData() {
  showLoading();
  try {
    const res = await fetch('./nifty_analysis.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    const data = await res.json();
    ENTRIES = data.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
    entryCount.textContent = `${ENTRIES.length} entr${ENTRIES.length === 1 ? 'y' : 'ies'} logged`;
    activeIndex = 0;
    renderDateLists();
    renderEntry(activeIndex);
    updateNavButtons();
  } catch (err) {
    showError(err);
  }
}

window.addEventListener('resize', () => { if (SPARK) wireSparkline(); });

loadData();
</script>
</body>
</html>
